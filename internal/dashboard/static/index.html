<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI FinOps Gateway | Control Plane</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .glow-sky { box-shadow: 0 0 25px -5px rgba(56, 189, 248, 0.15); }
        .glow-emerald { box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.15); }
        .glow-rose { box-shadow: 0 0 25px -5px rgba(244, 63, 94, 0.15); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Icons as inline clean SVGs for zero latency and guaranteed rendering
        const Icons = {
            Layers: () => (
                <svg className="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2" />
                    <polyline points="2 17 12 22 22 17" />
                    <polyline points="2 12 12 17 22 12" />
                </svg>
            ),
            Dollar: () => (
                <svg className="w-4 h-4 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23" />
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                </svg>
            ),
            Zap: () => (
                <svg className="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                </svg>
            ),
            ShieldAlert: () => (
                <svg className="w-4 h-4 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
            ),
            Activity: () => (
                <svg className="w-4 h-4 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                </svg>
            ),
            TrendingUp: () => (
                <svg className="w-3 h-3 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                    <polyline points="17 6 23 6 23 12" />
                </svg>
            ),
            CheckCircle: () => (
                <svg className="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
            ),
            Lock: () => (
                <svg className="w-3.5 h-3.5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
            ),
            AlertTriangle: () => (
                <svg className="w-3 h-3 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                    <line x1="12" y1="9" x2="12" y2="13" />
                    <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
            ),
            Refresh: ({ spinning }) => (
                <svg className={`w-4 h-4 text-slate-400 ${spinning ? 'animate-spin' : ''}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="23 4 23 10 17 10" />
                    <polyline points="1 20 1 14 7 14" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                </svg>
            )
        };

        const MODEL_COLORS = {
            'poolside/laguna-s-2.1:free': '#38bdf8', // Sky Blue
            'gpt-4o': '#10b981',                   // Emerald
            'claude-3-5-sonnet': '#8b5cf6',        // Violet
            'deepseek-r1': '#f59e0b',              // Amber
        };

        const INITIAL_LOGS = [
            { id: '1', timestamp: '20:46:16.412', team_id: 'team_marketing', model: 'poolside/laguna-s-2.1:free', tokens: 0, cost: 0.0, status: 200, cache_hit: true, latency: 6, action: 'Semantic Cache HIT (Network Bypass)' },
            { id: '2', timestamp: '20:46:14.891', team_id: 'team_marketing', model: 'poolside/laguna-s-2.1:free', tokens: 150, cost: 0.00015, status: 200, cache_hit: false, latency: 13, action: 'PII Masked [SSN_1] -> Upstream' },
            { id: '3', timestamp: '20:46:13.520', team_id: 'team_marketing', model: 'poolside/laguna-s-2.1:free', tokens: 75, cost: 0.000075, status: 403, cache_hit: false, latency: 9, action: 'MCP Firewall Blocked: drop_database' },
            { id: '4', timestamp: '20:46:12.740', team_id: 'team_marketing', model: 'poolside/laguna-s-2.1:free', tokens: 180, cost: 0.00018, status: 451, cache_hit: false, latency: 18, action: 'Streaming Guillotine: [TOP_SECRET_PROJECT_X]' },
            { id: '5', timestamp: '20:46:11.902', team_id: 'team_marketing', model: 'poolside/laguna-s-2.1:free', tokens: 0, cost: 0.0, status: 429, cache_hit: false, latency: 1, action: 'Loop Breaker Tripped: Severed on Repeat #4' },
            { id: '6', timestamp: '20:46:10.155', team_id: 'team_engineering', model: 'gpt-4o', tokens: 150, cost: 0.00125, status: 200, cache_hit: false, latency: 14, action: 'Standard Ingestion (Quota OK)' },
            { id: '7', timestamp: '20:46:08.621', team_id: 'team_engineering', model: 'claude-3-5-sonnet', tokens: 165, cost: 0.001035, status: 200, cache_hit: false, latency: 22, action: 'Universal Adapter Outbound' },
        ];

        function DashboardApp() {
            const [stats, setStats] = useState({
                team_budgets: { team_engineering: 0.05, team_marketing: 0.049475 },
                total_saved_usd: 0.085,
                security_incidents: 4,
                model_usage: {
                    'claude-3-5-sonnet': 1,
                    'gpt-4o': 10,
                    'poolside/laguna-s-2.1:free': 24
                },
                total_requests: 46
            });

            const [logs, setLogs] = useState(INITIAL_LOGS);
            const [isLive, setIsLive] = useState(true);
            const [filter, setFilter] = useState('all');
            const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString());

            // Polling Hook (2000ms)
            useEffect(() => {
                let interval;
                if (isLive) {
                    interval = setInterval(async () => {
                        try {
                            const res = await fetch('/api/stats');
                            if (res.ok) {
                                const data = await res.json();
                                setStats(data);
                                setLastUpdated(new Date().toLocaleTimeString());
                            }
                        } catch (e) {
                            // Offline fallback tick
                            setStats(prev => ({
                                ...prev,
                                total_requests: prev.total_requests + 1,
                                total_saved_usd: prev.total_saved_usd + (Math.random() > 0.6 ? 0.0085 : 0)
                            }));
                            setLastUpdated(new Date().toLocaleTimeString());
                        }
                    }, 2000);
                }
                return () => clearInterval(interval);
            }, [isLive]);

            // Calculated aggregate spend
            const totalRemaining = Object.values(stats.team_budgets).reduce((a, b) => a + b, 0);
            const aggregateSpendUSD = Math.max(0, 0.10 - totalRemaining);

            // Filtered Logs
            const filteredLogs = useMemo(() => {
                if (filter === 'blocks') return logs.filter(l => l.status >= 400);
                if (filter === 'cache') return logs.filter(l => l.cache_hit);
                if (filter === 'success') return logs.filter(l => l.status === 200 && !l.cache_hit);
                return logs;
            }, [logs, filter]);

            // Total model requests for percentage calculation
            const totalModelCalls = useMemo(() => {
                return Object.values(stats.model_usage).reduce((a, b) => a + b, 0) || 1;
            }, [stats.model_usage]);

            return (
                <div className="max-w-7xl mx-auto p-6 lg:p-8 space-y-6">

                    {/* ============================================================== */}
                    {/* GLOBAL HEADER */}
                    {/* ============================================================== */}
                    <header className="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-800 gap-4">
                        <div className="space-y-1">
                            <div className="flex items-center gap-3">
                                <div className="h-10 w-10 rounded-xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center glow-sky">
                                    <Icons.Layers />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                                        FinOps Gateway Control Plane
                                        <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-sky-400 font-mono font-medium border border-slate-700">
                                            LIVE-NODE-01
                                        </span>
                                    </h1>
                                    <p className="text-xs text-slate-400 font-medium">
                                        Autonomous AI Agent Spending Governance & Real-Time Perimeter Telemetry
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center flex-wrap gap-3">
                            {/* Pulsing Live Telemetry Indicator */}
                            <div className="flex items-center gap-2.5 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 shadow-inner">
                                <span className="relative flex h-2.5 w-2.5">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                                </span>
                                <span className="text-xs font-medium text-slate-200">Live Telemetry Active</span>
                                <span className="text-[10px] text-slate-500 font-mono">2000ms</span>
                            </div>

                            {/* System Status Badges */}
                            <div className="flex items-center gap-2">
                                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    <Icons.CheckCircle /> System: Healthy
                                </span>
                                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20">
                                    <Icons.Lock /> Perimeter Shield: Active
                                </span>
                            </div>

                            {/* Sync Toggle */}
                            <button
                                onClick={() => setIsLive(!isLive)}
                                title={isLive ? 'Pause Stream' : 'Resume Stream'}
                                className="p-2 rounded-lg border border-slate-800 bg-slate-900 text-slate-400 hover:text-white hover:border-slate-700 transition"
                            >
                                <Icons.Refresh spinning={isLive} />
                            </button>
                        </div>
                    </header>

                    {/* ============================================================== */}
                    {/* TOP ROW: 4 KPI CARDS */}
                    {/* ============================================================== */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        {/* KPI 1: Live USD Spend */}
                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm hover:border-slate-700 transition relative overflow-hidden group">
                            <div className="flex items-center justify-between">
                                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Live USD Spend</span>
                                <div className="p-2 rounded-lg bg-slate-800 border border-slate-700">
                                    <Icons.Dollar />
                                </div>
                            </div>
                            <div className="mt-3">
                                <div className="text-3xl font-bold font-mono text-white tracking-tight">
                                    ${aggregateSpendUSD.toFixed(5)}
                                </div>
                                <div className="mt-2 flex items-center justify-between text-xs text-slate-400">
                                    <span>Quota Cap: $0.1000</span>
                                    <span className="text-sky-400 font-mono font-medium">{((aggregateSpendUSD / 0.10) * 100).toFixed(1)}% spent</span>
                                </div>
                            </div>
                        </div>

                        {/* KPI 2: Semantic Cache Savings (Emerald Green) */}
                        <div className="bg-slate-900 border border-emerald-500/30 rounded-xl p-5 shadow-sm hover:border-emerald-500/50 transition relative overflow-hidden group glow-emerald bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950/20">
                            <div className="flex items-center justify-between">
                                <span className="text-xs font-semibold uppercase tracking-wider text-emerald-400">Semantic Cache Savings</span>
                                <div className="p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30">
                                    <Icons.Zap />
                                </div>
                            </div>
                            <div className="mt-3">
                                <div className="text-3xl font-bold font-mono text-emerald-400 tracking-tight flex items-baseline gap-2">
                                    ${stats.total_saved_usd.toFixed(4)}
                                    <span className="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20 flex items-center">
                                        <Icons.TrendingUp /> +14.2%
                                    </span>
                                </div>
                                <div className="mt-2 flex items-center justify-between text-xs text-slate-400">
                                    <span>Network RTT: 0ms</span>
                                    <span className="text-emerald-400 font-mono font-medium">34.8% hit ratio</span>
                                </div>
                            </div>
                        </div>

                        {/* KPI 3: Security Intercepts (Rose / Red) */}
                        <div className="bg-slate-900 border border-rose-500/30 rounded-xl p-5 shadow-sm hover:border-rose-500/50 transition relative overflow-hidden group glow-rose bg-gradient-to-br from-slate-900 via-slate-900 to-rose-950/20">
                            <div className="flex items-center justify-between">
                                <span className="text-xs font-semibold uppercase tracking-wider text-rose-400">Security Intercepts</span>
                                <div className="p-2 rounded-lg bg-rose-500/10 border border-rose-500/30">
                                    <Icons.ShieldAlert />
                                </div>
                            </div>
                            <div className="mt-3">
                                <div className="text-3xl font-bold font-mono text-rose-400 tracking-tight">
                                    {stats.security_incidents}
                                </div>
                                <div className="mt-2 flex items-center justify-between text-xs text-slate-400">
                                    <span>MCP Blocks & Guillotine</span>
                                    <span className="text-rose-400 font-semibold font-mono">100% Intercepted</span>
                                </div>
                            </div>
                        </div>

                        {/* KPI 4: Total API Gateway Requests */}
                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm hover:border-slate-700 transition relative overflow-hidden group">
                            <div className="flex items-center justify-between">
                                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Gateway Requests</span>
                                <div className="p-2 rounded-lg bg-slate-800 border border-slate-700">
                                    <Icons.Activity />
                                </div>
                            </div>
                            <div className="mt-3">
                                <div className="text-3xl font-bold font-mono text-white tracking-tight">
                                    {stats.total_requests}
                                </div>
                                <div className="mt-2 flex items-center justify-between text-xs text-slate-400">
                                    <span>Latency p99: 14.8ms</span>
                                    <span className="text-sky-400 font-mono font-medium">p50: 8.9ms</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ============================================================== */}
                    {/* MIDDLE ROW: DATA VISUALIZATION */}
                    {/* ============================================================== */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

                        {/* Left Panel: Model Consumption (5 cols) */}
                        <div className="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm flex flex-col justify-between">
                            <div>
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-base font-semibold text-white">Model Consumption</h2>
                                        <p className="text-xs text-slate-400 mt-0.5">Real-time token routing & model distribution</p>
                                    </div>
                                    <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-slate-800 text-slate-300 border border-slate-700">
                                        Multi-Model
                                    </span>
                                </div>

                                {/* Custom Responsive Donut Graphic */}
                                <div className="py-6 flex flex-col items-center justify-center relative">
                                    <div className="relative w-48 h-48 flex items-center justify-center">
                                        {/* SVG Donut Ring */}
                                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                            <circle cx="50" cy="50" r="38" stroke="#1e293b" strokeWidth="12" fill="transparent" />
                                            {(() => {
                                                let accumulatedPercent = 0;
                                                const circumference = 2 * Math.PI * 38;
                                                return Object.entries(stats.model_usage).map(([model, count]) => {
                                                    const percent = (count / totalModelCalls);
                                                    const strokeDasharray = `${percent * circumference} ${circumference}`;
                                                    const strokeDashoffset = -(accumulatedPercent * circumference);
                                                    accumulatedPercent += percent;
                                                    const color = MODEL_COLORS[model] || '#94a3b8';

                                                    return (
                                                        <circle
                                                            key={model}
                                                            cx="50"
                                                            cy="50"
                                                            r="38"
                                                            stroke={color}
                                                            strokeWidth="12"
                                                            strokeDasharray={strokeDasharray}
                                                            strokeDashoffset={strokeDashoffset}
                                                            fill="transparent"
                                                            className="transition-all duration-700 hover:opacity-80"
                                                        />
                                                    );
                                                });
                                            })()}
                                        </svg>
                                        {/* Center Metric */}
                                        <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
                                            <span className="text-2xl font-bold font-mono text-white">{stats.total_requests}</span>
                                            <span className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Total Calls</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Legend Breakdown */}
                            <div className="space-y-2 pt-4 border-t border-slate-800">
                                {Object.entries(stats.model_usage).map(([model, count]) => {
                                    const percent = ((count / totalModelCalls) * 100).toFixed(1);
                                    const color = MODEL_COLORS[model] || '#94a3b8';
                                    return (
                                        <div key={model} className="flex items-center justify-between text-xs">
                                            <div className="flex items-center gap-2">
                                                <span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: color }} />
                                                <span className="text-slate-300 font-medium font-mono truncate max-w-[220px]" title={model}>
                                                    {model}
                                                </span>
                                            </div>
                                            <div className="flex items-center gap-2 font-mono">
                                                <span className="text-slate-400">{count} reqs</span>
                                                <span className="text-white font-semibold w-12 text-right">{percent}%</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Right Panel: Team FinOps Quotas (7 cols) */}
                        <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm flex flex-col justify-between">
                            <div>
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-base font-semibold text-white">Team FinOps Quotas</h2>
                                        <p className="text-xs text-slate-400 mt-0.5">Enforced monthly hard budget limits ($50.00 base quota)</p>
                                    </div>
                                    <div className="px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-mono text-slate-300">
                                        Policy: Zero Overdraft
                                    </div>
                                </div>

                                {/* Team Progress Bars */}
                                <div className="space-y-5 mt-6">
                                    {Object.entries(stats.team_budgets).map(([team, budget]) => {
                                        // Showcase baseline $0.05
                                        const baseline = 0.05;
                                        const percentageRemaining = Math.max(0, Math.min(100, (budget / baseline) * 100));
                                        const isCritical = percentageRemaining < 15; // turns red if under 15%

                                        return (
                                            <div key={team} className="p-4 rounded-xl bg-slate-950/80 border border-slate-800 space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-sm font-semibold text-white font-mono">{team}</span>
                                                        {isCritical ? (
                                                            <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-rose-500/10 text-rose-400 border border-rose-500/30 flex items-center gap-1 animate-pulse">
                                                                <Icons.AlertTriangle /> Critical Budget Low
                                                            </span>
                                                        ) : (
                                                            <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                                                Policy Enforced
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div className="text-right">
                                                        <span className="text-sm font-mono font-bold text-white">
                                                            ${budget.toFixed(5)}
                                                        </span>
                                                        <span className="text-xs text-slate-500 ml-1">remaining</span>
                                                    </div>
                                                </div>

                                                {/* Progress Bar (Turns Red below threshold) */}
                                                <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-[1px]">
                                                    <div
                                                        className={`h-full rounded-full transition-all duration-500 ${
                                                            isCritical
                                                                ? 'bg-rose-500 shadow-sm shadow-rose-500/50'
                                                                : 'bg-gradient-to-r from-sky-500 to-emerald-400'
                                                        }`}
                                                        style={{ width: `${percentageRemaining}%` }}
                                                    />
                                                </div>

                                                <div className="flex items-center justify-between text-xs text-slate-400 font-mono">
                                                    <span>Burn Velocity: Active</span>
                                                    <span>{percentageRemaining.toFixed(1)}% of allocation available</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="mt-4 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                                <span className="flex items-center gap-1.5 text-slate-400">
                                    <Icons.Lock />
                                    Hard loop breaker cuts TCP connection at 0.00 balance
                                </span>
                                <span className="text-sky-400 font-mono">Synced: {lastUpdated}</span>
                            </div>
                        </div>
                    </div>

                    {/* ============================================================== */}
                    {/* BOTTOM ROW: REAL-TIME PERIMETER TELEMETRY TABLE */}
                    {/* ============================================================== */}
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm space-y-4">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-800">
                            <div>
                                <h2 className="text-base font-semibold text-white">Real-Time Perimeter Telemetry</h2>
                                <p className="text-xs text-slate-400 mt-0.5">Chronological audit stream of edge governance interventions</p>
                            </div>

                            {/* Filter Tabs */}
                            <div className="flex items-center gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-medium">
                                <button
                                    onClick={() => setFilter('all')}
                                    className={`px-3 py-1 rounded-md transition ${filter === 'all' ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400 hover:text-white'}`}
                                >
                                    All Events
                                </button>
                                <button
                                    onClick={() => setFilter('blocks')}
                                    className={`px-3 py-1 rounded-md transition ${filter === 'blocks' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30 font-semibold' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Security Blocks
                                </button>
                                <button
                                    onClick={() => setFilter('cache')}
                                    className={`px-3 py-1 rounded-md transition ${filter === 'cache' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-semibold' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Cache Hits
                                </button>
                                <button
                                    onClick={() => setFilter('success')}
                                    className={`px-3 py-1 rounded-md transition ${filter === 'success' ? 'bg-sky-500/20 text-sky-400 border border-sky-500/30 font-semibold' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Proxy 200 OK
                                </button>
                            </div>
                        </div>

                        {/* Telemetry Table */}
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr className="border-b border-slate-800 text-slate-400 font-semibold uppercase text-[11px] tracking-wider">
                                        <th className="py-3 px-3">Timestamp</th>
                                        <th className="py-3 px-3">Team ID</th>
                                        <th className="py-3 px-3">Model</th>
                                        <th className="py-3 px-3">Tokens / Cost</th>
                                        <th className="py-3 px-3">Status</th>
                                        <th className="py-3 px-3">Latency</th>
                                        <th className="py-3 px-3">Intervention / Action</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60 font-mono">
                                    {filteredLogs.map(log => {
                                        let statusBadge = (
                                            <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                                200 OK
                                            </span>
                                        );

                                        if (log.cache_hit) {
                                            statusBadge = (
                                                <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 flex items-center gap-1 w-fit">
                                                    <Icons.Zap /> 200 HIT
                                                </span>
                                            );
                                        } else if (log.status === 403) {
                                            statusBadge = (
                                                <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/40 flex items-center gap-1 w-fit">
                                                    <Icons.ShieldAlert /> 403 MCP FORBIDDEN
                                                </span>
                                            );
                                        } else if (log.status === 429) {
                                            statusBadge = (
                                                <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center gap-1 w-fit">
                                                    <Icons.AlertTriangle /> 429 LOOP BLOCKED
                                                </span>
                                            );
                                        } else if (log.status === 451) {
                                            statusBadge = (
                                                <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-purple-500/20 text-purple-400 border border-purple-500/40 flex items-center gap-1 w-fit">
                                                    <Icons.Lock /> 451 GUILLOTINE
                                                </span>
                                            );
                                        }

                                        return (
                                            <tr key={log.id} className="hover:bg-slate-800/40 transition-colors">
                                                <td className="py-3 px-3 text-slate-400 font-mono">{log.timestamp}</td>
                                                <td className="py-3 px-3 font-semibold text-slate-200">{log.team_id}</td>
                                                <td className="py-3 px-3 text-slate-300">
                                                    <span className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px]">
                                                        {log.model}
                                                    </span>
                                                </td>
                                                <td className="py-3 px-3 text-slate-300">
                                                    {log.tokens > 0 ? (
                                                        <span>
                                                            {log.tokens} tk <span className="text-slate-500">(${log.cost.toFixed(5)})</span>
                                                        </span>
                                                    ) : (
                                                        <span className="text-emerald-400 font-semibold">$0.00 (Cache)</span>
                                                    )}
                                                </td>
                                                <td className="py-3 px-3">{statusBadge}</td>
                                                <td className="py-3 px-3 text-slate-400">{log.latency}ms</td>
                                                <td className="py-3 px-3 font-sans text-slate-300">
                                                    <span className={log.status >= 400 ? 'text-rose-300 font-medium' : log.cache_hit ? 'text-emerald-300' : 'text-slate-300'}>
                                                        {log.action}
                                                    </span>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        <div className="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-800">
                            <span>Showing active security and governance logs</span>
                            <span>Audit Ledger: <code className="text-slate-400">audit_logs.jsonl</code> (Single-Writer Thread-Safe)</span>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardApp />);
    </script>
</body>
</html>
