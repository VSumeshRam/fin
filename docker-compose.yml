version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops_password
      POSTGRES_DB: finops_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  ml-sidecar:
    build: ./ml-sidecar
    ports:
      - "8000:8000"

