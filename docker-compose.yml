version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finops-gateway
    restart: unless-stopped
    ports:
      - "8080:8080" # FinOps Gateway L7 Proxy
      - "3000:3000" # Executive Control Plane Dashboard
    environment:
      - PORT=8080
      - DASHBOARD_PORT=3000
      - REDIS_ADDR=redis:6379
      - REDIS_PASS=
      - ML_SIDECAR_URL=http://ml-sidecar:8000
      - UPSTREAM_URL=${UPSTREAM_URL:-https://openrouter.ai/api/v1}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - POSTGRES_DSN=postgres://finops:finops_password@postgres:5432/finops_db?sslmode=disable
    volumes:
      - ./audit_logs.jsonl:/app/audit_logs.jsonl
      - ./rbac/policies.json:/app/rbac/policies.json
    depends_on:
      redis:
        condition: service_healthy
      ml-sidecar:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: finops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ml-sidecar:
    build: ./ml-sidecar
    container_name: finops-ml-sidecar
    restart: unless-stopped
    ports:
      - "8000:8000"

  postgres:
    image: postgres:15-alpine
    container_name: finops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops_password
      POSTGRES_DB: finops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  redis-data:
  postgres-data:
